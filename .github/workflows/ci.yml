name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt pytest

      - name: Pipeline unit tests
        run: python -m pytest -q pipeline/tests

      # Reuse the snapshot cache written by the deploy workflow (read-only here).
      - name: Restore snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-

      - name: Build site data
        run: python pipeline/build.py --out web/data --cache pipeline/.cache --history-days 8 --max-snapshots 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Headless smoke test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/smoke.mjs
