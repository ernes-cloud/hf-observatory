name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt pytest

      - name: Pipeline unit tests
        run: python -m pytest -q pipeline/tests

      # Reuse the snapshot cache written by the deploy workflow (read-only here).
      - name: Restore snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/snapshots
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-

      - name: Build site data
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read accepted benchmark issues and the vLLM recipes list
        run: python pipeline/build.py --out web/data --cache pipeline/.cache --history-days 8 --max-snapshots 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test tools
        run: npm install --no-save --no-package-lock playwright@1.56.1 yaml@2.8.1

      - name: Advisor engine unit + fuzz tests (on the freshly built data)
        run: node --test tests/advisor-engine.test.mjs tests/advisor-calibration.test.mjs tests/advisor-fuzz.test.mjs

      - name: Validate generated Docker Compose files with docker compose config
        run: node tests/compose-validate.mjs --max 600

      - name: Headless smoke test
        run: |
          npx playwright install --with-deps chromium
          node tests/smoke.mjs
          node tests/advisor-ui.mjs --steps 120
